services:
  hc2hb:
    build:
      context: .
    env_file: .env
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/healthcheck | jq -e '.okay == true' >/dev/null",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 4s
